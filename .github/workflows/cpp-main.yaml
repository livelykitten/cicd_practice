name: C++ CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: g++ main.cpp -o app
      - run: ./app

      - name: Build tests
        run: g++ test.cpp -o test
      
      - name: Run tests
        run: ./test