name: C++ CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-test:
    runs-on: ubuntu-latest
    defaults:
      working-directory: ./cpp
    steps:
      - uses: actions/checkout@v6

      - name: Cpp main
        run: g++ main.cpp -o app
        run: ./app

      - name: Build tests
        run: g++ test.cpp -o test
      
      - name: Run tests
        run: ./test